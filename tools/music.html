<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>TD Infinity jukebox</title>
<style>
  html, body { margin: 0; background: #1b1f2a; color: #eee; font: 14px/1.3 system-ui, sans-serif; }
  header { position: sticky; top: 0; background: #11141c; padding: 10px 16px; display: flex; gap: 14px; align-items: center; border-bottom: 2px solid #000; }
  header b { font-size: 17px; }
  #now { color: #ffd54f; flex: 1; }
  main { padding: 6px 16px 30px; }
  h2 { margin: 18px 0 6px; font-size: 15px; color: #9fa8da; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 6px; }
  button { font: inherit; color: #eee; background: #2b3142; border: 1px solid #000; border-radius: 6px; padding: 6px 9px; text-align: left; cursor: pointer; }
  button:hover { background: #394058; }
  button.on { background: #ffd54f; color: #000; }
  button small { display: block; opacity: 0.7; font-size: 11px; }
</style>
</head>
<body>
<header>
  <b>♪ Jukebox</b>
  <span id="now">Click a track to play it.</span>
  <button id="stop">Stop</button>
  <label>Volume <input id="vol" type="range" min="0" max="3" step="0.05" value="1.5"></label>
</header>
<main id="list"></main>
<script type="module" src="./music.js"></script>
</body>
</html>
